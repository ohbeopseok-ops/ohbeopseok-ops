name: Control Tower CI

on:
  pull_request:
    paths:
      - "control_tower/**"
      - ".github/workflows/control-tower-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile control_tower/control_tower.py
      - name: Unit tests
        run: python -m unittest discover -s control_tower/tests -v
