name: Repository Control Tower V0.2

on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/repository_control_tower_v02.py"
      - "control_tower/repository-governance.json"
      - ".github/workflows/repository-control-tower-v0.2.yml"

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: repository-control-tower-v0.2
  cancel-in-progress: true

jobs:
  health-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate V0.2 repository health registry
        env:
          CONTROL_TOWER_TOKEN: ${{ secrets.CONTROL_TOWER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          JOYLAB_GITHUB_OWNER: ohbeopseok-ops
        run: python scripts/repository_control_tower_v02.py

      - name: Validate generated JSON and governance coverage
        run: |
          python -m json.tool control_tower/repository-health-v0.2.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("control_tower/repository-health-v0.2.json").read_text())
          if not p["scan_complete"]:
              raise SystemExit(
                  "Full owner scan is incomplete. Configure CONTROL_TOWER_TOKEN "
                  "with read access to all owned public/private repositories. "
                  f"scope={p['scope_mode']} missing={p['missing_from_scan']} "
                  f"ungoverned={p['ungoverned_repositories']}"
              )
          if len(p["repositories"]) != 44:
              raise SystemExit(f"Expected 44 governed repositories, got {len(p['repositories'])}")
          PY

      - name: Commit registry changes
        run: |
          CHANGES="$(git status --porcelain -- GITHUB_HEALTH_REGISTRY_V0.2.md control_tower/repository-health-v0.2.json)"
          if [ -z "$CHANGES" ]; then
            echo "No health-state changes."
            exit 0
          fi
          git config user.name "JoyLab Control Tower"
          git config user.email "actions@users.noreply.github.com"
          git add GITHUB_HEALTH_REGISTRY_V0.2.md control_tower/repository-health-v0.2.json
          git commit -m "chore(control-tower): refresh V0.2 repository health"
          git push
