name: JoyLab Repository Control Tower

on:
  workflow_dispatch:
  schedule:
    - cron: "15 22 * * *"
  push:
    branches:
      - main
    paths:
      - "control_tower/**"
      - ".github/workflows/repository-control-tower.yml"

permissions:
  contents: write

concurrency:
  group: joylab-repository-control-tower
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic unit tests
        run: python -m unittest discover -s control_tower/tests -v

      - name: Scan repositories
        env:
          JOYLAB_GITHUB_OWNER: ohbeopseok-ops
          JOYLAB_GITHUB_TOKEN: ${{ secrets.JOYLAB_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python control_tower/control_tower.py

      - name: Publish changed registry
        run: |
          if git diff --quiet -- reports/repository-health.json reports/repository-health.md; then
            echo "No health-state changes."
            exit 0
          fi
          git config user.name "joylab-control-tower[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/repository-health.json reports/repository-health.md
          git commit -m "chore: refresh repository health registry"
          git push
